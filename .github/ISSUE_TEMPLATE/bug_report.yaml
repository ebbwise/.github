name: Bug report
description: Something isn't behaving the way it should.
title: "[Bug] "
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for taking the time to report a bug. The fields below help
        diagnose and reproduce the problem quickly — please fill in as much
        as you can.

        **Please don't paste real health data** (symptoms, medications,
        exported logs) into an issue. Describe the shape of the data instead,
        or use made-up values.

  - type: input
    id: version
    attributes:
      label: Version
      description: Release version, commit SHA, or how you're running this.
    validations:
      required: true

  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      description: What did you do, step by step? The more specific, the faster this can be reproduced.
    validations:
      required: true

  - type: textarea
    id: expected
    attributes:
      label: Expected behavior
    validations:
      required: true

  - type: textarea
    id: actual
    attributes:
      label: Actual behavior
      description: Include any error text verbatim.
    validations:
      required: true

  - type: textarea
    id: extra
    attributes:
      label: Anything else?
      description: Logs, screenshots, workarounds tried, related issues.
